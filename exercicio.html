<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercícios JS</title>
</head>
<body>

<h1>Resultados</h1>

<div id="resultado"></div>

<script>

function ehPrimo(n) {
    if (n <= 1) return false;

    for (let i = 2; i < n; i++) {
        if (n % i === 0) {
            return false;
        }
    }

    return true;
}

function somatorio(numeros) {
    let soma = 0;

    for (let i = 0; i < numeros.length; i++) {
        soma += numeros[i];
    }

    return soma;
}

function fibonacci(n) {
    if (n === 0) return 0;
    if (n === 1) return 1;

    let a = 0;
    let b = 1;

    for (let i = 2; i <= n; i++) {
        let resultado = a + b;
        a = b;
        b = resultado;
    }

    return b;
}

function mdc(a, b) {
    while (b !== 0) {
        let resto = a % b;
        a = b;
        b = resto;
    }

    return a;
}

function quicksort(arr) {
    if (arr.length <= 1) return arr;

    let pivo = arr[0];
    let menores = [];
    let maiores = [];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] <= pivo) {
            menores.push(arr[i]);
        } else {
            maiores.push(arr[i]);
        }
    }

    return [
        ...quicksort(menores),
        pivo,
        ...quicksort(maiores)
    ];
}

function contagem(dados, N) {
    let primeiro = dados[0];
    let contador = 0;

    for (let i = 0; i < dados.length; i++) {
        if (dados[i] >= primeiro && dados[i] <= N) {
            contador++;
        }
    }

    return contador;
}

let resultado = document.getElementById("resultado");

resultado.innerHTML += "<h2>1. Número Primo</h2>";
resultado.innerHTML += "7 é primo? " + ehPrimo(7) + "<br><br>";

resultado.innerHTML += "<h2>2. Somatório</h2>";
resultado.innerHTML += "Soma = " + somatorio([1,2,3,4]) + "<br><br>";

resultado.innerHTML += "<h2>3. Fibonacci</h2>";
resultado.innerHTML += "Fibonacci de 8 = " + fibonacci(8) + "<br><br>";

resultado.innerHTML += "<h2>4. MDC</h2>";
resultado.innerHTML += "MDC(20,8) = " + mdc(20,8) + "<br><br>";

resultado.innerHTML += "<h2>5. Quicksort</h2>";
resultado.innerHTML += quicksort([5,3,8,1,2]).join(", ") + "<br><br>";

resultado.innerHTML += "<h2>6. Contagem</h2>";
resultado.innerHTML += contagem([1,2,3,4,5], 4);

</script>

</body>
</html>
